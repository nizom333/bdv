name: Stats

# Раз в неделю копит статистику в ветке `stats`: GitHub хранит трафик
# только 14 дней. Данные и сводка: https://github.com/nizom333/bdv/tree/stats
#
# Звёзды, форки и скачивания релизов собираются с GITHUB_TOKEN.
# Для трафика (просмотры, клоны, источники) нужен секрет STATS_TOKEN:
# fine-grained PAT только на этот репозиторий с правом Administration: read.
on:
  schedule:
    - cron: "17 3 * * 1" # понедельник, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth 1 origin stats:refs/remotes/origin/stats
            git worktree add data origin/stats
            git -C data switch -c stats
          else
            git worktree add --detach data
            git -C data switch --orphan stats
          fi

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 scripts/stats.py "$REPO" data

      - name: Commit
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "stats: $(date -u +%F)"
          git push origin stats
